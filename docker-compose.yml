services:
  web:
    image: alphabloo7/s2-pend-biologi:latest
    container_name: s2-pend-biologi-web
    restart: always
    ports:
      - "8090:80" # Ubah port 8090 jika port tersebut sudah terpakai di server VPS Anda (misal: 8086)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
